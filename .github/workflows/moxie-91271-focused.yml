name: Temporary 91271 focused proof
on:
  push:
    branches: [moxie-validation/91271-focused-20260926]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 010072ed577169c878d691cb2f8a663df1869eea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify candidate and install pinned dependencies
        env:
          CI: 'true'
        run: |
          test "$(git rev-parse HEAD)" = 010072ed577169c878d691cb2f8a663df1869eea
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Tool helper worker and full Gateway regressions
        env:
          CI: 'true'
        run: |
          corepack pnpm test src/agents/tools/sessions-send-helpers.test.ts src/agents/openclaw-tools.sessions.test.ts src/gateway/worker-environments/worker-session-tool-executor.send.test.ts src/gateway/server.sessions-send.test.ts src/agents/tools/sessions-send-followup.test.ts
      - name: Changed ownership boundary static checks
        env:
          CI: 'true'
        run: |
          corepack pnpm exec oxfmt --check src/agents/tools/sessions-send-tool.ts src/agents/tools/sessions-send-tool.a2a.ts
          corepack pnpm exec oxlint src/agents/tools/sessions-send-tool.ts src/agents/tools/sessions-send-tool.a2a.ts
          corepack pnpm tsgo:core
          corepack pnpm tsgo:core:test --ci-graphs-json '["core-test-agents-tools","core-test-agents-root","core-test-gateway-root","core-test-gateway-other","core-test-gateway-server"]' --concurrency 2
